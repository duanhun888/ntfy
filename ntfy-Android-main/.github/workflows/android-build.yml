name: Android Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build F-Droid debug APK
        run: chmod +x gradlew && ./gradlew assembleFdroidDebug --stacktrace

      - name: Upload F-Droid debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ntfy-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error

      - name: Build Play debug APK
        # play flavor needs google-services.json; use a stub so CI can compile
        run: |
          if [ ! -f app/google-services.json ]; then
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ntfy-ci-stub",
              "storage_bucket": "ntfy-ci-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "io.heckel.ntfy"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKeyForCiBuildOnly000000000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000001",
                  "android_client_info": {
                    "package_name": "io.heckel.ntfy.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKeyForCiBuildOnly000000000" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          ./gradlew assemblePlayDebug --stacktrace

      - name: Upload Play debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ntfy-play-debug
          path: app/build/outputs/apk/play/debug/*.apk
          if-no-files-found: error
