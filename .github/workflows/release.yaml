# This fork does not publish Docker Hub images or run goreleaser.
# GitHub Releases (source + APK) are created from tags separately.
# Upstream required secrets.DOCKER_HUB_TOKEN, which is not configured here.
name: release
on:
  workflow_dispatch:
jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Skip Docker Hub publish
        run: echo "Docker login/publish is disabled for this repository."
